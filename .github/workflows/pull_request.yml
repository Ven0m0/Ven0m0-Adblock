name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
          experimental: true
      - name: Install dependencies
        run: bun install
      - name: Run JavaScript quality checks
        run: bun run lint:js
      - name: Run formatting checks
        run: bun run format:check
      - name: Run userscript unit tests
        run: bun run test:unit
      - name: Install Python dependencies
        run: mise exec -- uv sync --frozen
      - name: Run Python lint
        run: mise exec -- uv run ruff check --no-fix .
      - name: Run Python format check
        run: mise exec -- uv run ruff format --check .
      - name: Run Python tests
        run: mise exec -- uv run pytest Scripts
