name: AGLint
permissions:
  contents: read
  packages: read
on:
  workflow_dispatch:
  #push:
    #branches:
      #- main
    #paths:
      #- "**/*.txt"
  #pull_request:
    #branches:
      #- main
    #paths:
      #- "**/*.txt"

jobs:
  lint:
    name: Run AGLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out to repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: AGLint cache
        uses: actions/cache@v6
        with:
          path: .aglintcache
          key: >
            ${{ runner.os }}-aglint-${{ hashFiles(
              '**/.aglintignore',
              '**/.aglintrc',
              '**/.aglintrc.json',
              '**/.aglintrc.yaml',
              '**/.aglintrc.yml',
              '**/aglint.config.json',
              '**/aglint.config.yaml',
              '**/aglint.config.yml',
              '**/package.json',
              'bun.lock'
            ) }}
          restore-keys: |
            ${{ runner.os }}-aglint-
      # If the linter found any errors, it will exit with a non-zero code, which will cause the job to fail
      - name: Run AGLint
        run: bun run aglint
