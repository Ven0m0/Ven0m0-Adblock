[project]
name = "ven0m0-adblock"
version = "1.0.0"
description = "Ad-blocking filter list utilities"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiohttp>=3.14.1",
  "aiofiles>=25.1.0",
  "httpx[http2]>=0.28.1",
]

[dependency-groups]
dev = [
    "prek>=0.4.12",
    "ruff>=0.16.0",
    "vulture>=2.16",
    "basedpyright>=1.39.3",
    "ty>=0.0.66",
    "deadcode>=2.4.1",
    "pytest>=9.1.1",
]

[tool.uv]
managed = true
package = false

[tool.ruff]
line-length = 120
target-version = "py314"
fix = true
exclude = [
  ".git",
  ".cache",
  ".var",
  ".venv",
  "venv",
  "node_modules",
  "__pycache__",
  "*.pyc",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "EXE001",  # shebang executability is not enforced for repo-managed Python modules
  "E501",  # line too long (handled by formatter)
  "T201",  # print() in CLI scripts is intentional
  "BLE001",  # broad exception in CLI error handlers is acceptable
  "COM812",  # trailing comma conflicts with formatter
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
